[project]
name = "cowiki-policy"
version = "0.1.0"
description = "Local task-level policy experiments for CoWiki agent routing"
requires-python = ">=3.11"

[project.scripts]
cowiki-policy = "cowiki_policy.cli:main"
cowiki-policy-lab = "cowiki_policy.lab:main"
cowiki-policy-train = "cowiki_policy.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
