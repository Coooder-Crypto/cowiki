<svg xmlns="http://www.w3.org/2000/svg" width="960" height="485" viewBox="0 0 960 485" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">CONFLICTS 正式数据与平衡 pilot 的类别分布</title><desc id="figure-desc">458 题正式数据中五类分别为 35.2%、25.1%、25.1%、13.5%、1.1%；10 题平衡 pilot 每类 20%。</desc><rect x="0" y="0" width="960" height="485" fill="#ffffff" /><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" fill="#17212b" font-size="21" font-weight="600" text-anchor="start">CONFLICTS 类别分布：正式数据 vs 平衡 pilot</text><text x="28" y="64" fill="#526171" font-size="13" font-weight="400" text-anchor="start">正式数据 n=458 题；pilot n=10 题，每类 2 题</text><line x1="292" y1="105" x2="292" y2="395" stroke="#d9e0e6" stroke-width="1" /><text x="292" y="92" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">0%</text><line x1="432" y1="105" x2="432" y2="395" stroke="#d9e0e6" stroke-width="1" /><text x="432" y="92" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">10%</text><line x1="572" y1="105" x2="572" y2="395" stroke="#d9e0e6" stroke-width="1" /><text x="572" y="92" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">20%</text><line x1="712" y1="105" x2="712" y2="395" stroke="#d9e0e6" stroke-width="1" /><text x="712" y="92" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">30%</text><line x1="852" y1="105" x2="852" y2="395" stroke="#d9e0e6" stroke-width="1" /><text x="852" y="92" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">40%</text><text x="28" y="137" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">无冲突</text><rect x="292" y="118" width="492.13973799126643" height="16" fill="#497db3" /><rect x="292" y="140" width="280" height="16" fill="#087f75" /><text x="791.1397379912664" y="131" fill="#526171" font-size="12" font-weight="400" text-anchor="start">35.2%</text><text x="579" y="153" fill="#526171" font-size="12" font-weight="400" text-anchor="start">20.0%</text><text x="28" y="194" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">互补信息</text><rect x="292" y="175" width="351.528384279476" height="16" fill="#497db3" /><rect x="292" y="197" width="280" height="16" fill="#087f75" /><text x="650.528384279476" y="188" fill="#526171" font-size="12" font-weight="400" text-anchor="start">25.1%</text><text x="579" y="210" fill="#526171" font-size="12" font-weight="400" text-anchor="start">20.0%</text><text x="28" y="251" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">观点或研究冲突</text><rect x="292" y="232" width="351.528384279476" height="16" fill="#497db3" /><rect x="292" y="254" width="280" height="16" fill="#087f75" /><text x="650.528384279476" y="245" fill="#526171" font-size="12" font-weight="400" text-anchor="start">25.1%</text><text x="579" y="267" fill="#526171" font-size="12" font-weight="400" text-anchor="start">20.0%</text><text x="28" y="308" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">信息过时</text><rect x="292" y="289" width="189.51965065502185" height="16" fill="#497db3" /><rect x="292" y="311" width="280" height="16" fill="#087f75" /><text x="488.51965065502185" y="302" fill="#526171" font-size="12" font-weight="400" text-anchor="start">13.5%</text><text x="579" y="324" fill="#526171" font-size="12" font-weight="400" text-anchor="start">20.0%</text><text x="28" y="365" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">错误信息</text><rect x="292" y="346" width="15.283842794759826" height="16" fill="#497db3" /><rect x="292" y="368" width="280" height="16" fill="#087f75" /><text x="314.28384279475983" y="359" fill="#526171" font-size="12" font-weight="400" text-anchor="start">1.1%</text><text x="579" y="381" fill="#526171" font-size="12" font-weight="400" text-anchor="start">20.0%</text><rect x="294" y="420" width="14" height="14" fill="#497db3" /><text x="315" y="432" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">正式数据</text><rect x="420" y="420" width="14" height="14" fill="#087f75" /><text x="441" y="432" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">平衡 pilot</text><text x="28" y="467" fill="#526171" font-size="13" font-weight="400" text-anchor="start">平衡 pilot 的 accuracy 不能外推为正式分布上的 accuracy。</text></g></svg>
