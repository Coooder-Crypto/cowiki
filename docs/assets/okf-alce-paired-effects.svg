<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="443" viewBox="0 0 1060 443" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">ALCE QAMPARI：配对 F1@5 差值与 95% 区间</title><desc id="figure-desc">v0.2 结构化减富 prose：正 1.5pp，描述性区间 0 到正 4.0pp。减无 metadata：正 1.1pp，区间 0 到正 3.3pp。减 v0.1 原生：正 0.4pp，区间 0 到正 1.3pp。</desc><rect x="0" y="0" width="1060" height="443" fill="#ffffff" /><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" fill="#17212b" font-size="21" font-weight="600" text-anchor="start">ALCE QAMPARI：配对 F1@5 差值与 95% 区间</text><text x="28" y="64" fill="#526171" font-size="13" font-weight="400" text-anchor="start">10 个独立 item，每 item 仅 1 次生成；区间未包含生成与 prompt 变异</text><line x1="303" y1="118" x2="303" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="303" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">-1</text><line x1="385.3333333333333" y1="118" x2="385.3333333333333" y2="348" stroke="#17212b" stroke-width="1.8" /><text x="385.3333333333333" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">0</text><line x1="467.66666666666663" y1="118" x2="467.66666666666663" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="467.66666666666663" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+1</text><line x1="550" y1="118" x2="550" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="550" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+2</text><line x1="632.3333333333333" y1="118" x2="632.3333333333333" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="632.3333333333333" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+3</text><line x1="714.6666666666667" y1="118" x2="714.6666666666667" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="714.6666666666667" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+4</text><line x1="797" y1="118" x2="797" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="797" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+5</text><text x="28" y="159" fill="#17212b" font-size="14" font-weight="600" text-anchor="start">v0.2 结构化 − 富 prose</text><line x1="385.3333333333333" y1="154" x2="714.6666666666667" y2="154" stroke="#087f75" stroke-width="3" /><line x1="385.3333333333333" y1="145" x2="385.3333333333333" y2="163" stroke="#087f75" stroke-width="2" /><line x1="714.6666666666667" y1="145" x2="714.6666666666667" y2="163" stroke="#087f75" stroke-width="2" /><circle cx="508.83333333333337" cy="154" r="6" fill="#087f75" /><text x="815" y="159" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">+1.5pp [0.0, +4.0]</text><text x="28" y="233" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">v0.2 结构化 − 无 metadata</text><line x1="385.3333333333333" y1="228" x2="657.0333333333333" y2="228" stroke="#497db3" stroke-width="3" /><line x1="385.3333333333333" y1="219" x2="385.3333333333333" y2="237" stroke="#497db3" stroke-width="2" /><line x1="657.0333333333333" y1="219" x2="657.0333333333333" y2="237" stroke="#497db3" stroke-width="2" /><circle cx="475.9" cy="228" r="6" fill="#497db3" /><text x="815" y="233" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">+1.1pp [0.0, +3.3]</text><text x="28" y="307" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">v0.2 结构化 − v0.1 原生</text><line x1="385.3333333333333" y1="302" x2="492.3666666666667" y2="302" stroke="#497db3" stroke-width="3" /><line x1="385.3333333333333" y1="293" x2="385.3333333333333" y2="311" stroke="#497db3" stroke-width="2" /><line x1="492.3666666666667" y1="293" x2="492.3666666666667" y2="311" stroke="#497db3" stroke-width="2" /><circle cx="418.26666666666665" cy="302" r="6" fill="#497db3" /><text x="815" y="307" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">+0.4pp [0.0, +1.3]</text><text x="565" y="374" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">差值（百分点；右侧有利于 v0.2）</text><text x="28" y="426" fill="#526171" font-size="13" font-weight="400" text-anchor="start">仅为答案级描述统计；官方 AutoAIS citation evaluator 尚未运行。</text></g></svg>
