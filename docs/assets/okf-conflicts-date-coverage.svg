<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">CONFLICTS 输入来源日期覆盖率</title><desc id="figure-desc">4052 篇文档中 1959 篇有日期。458 题中 114 题全部有日期，176 题部分有日期，168 题均无日期。</desc><rect x="0" y="0" width="960" height="310" fill="#ffffff" /><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" fill="#17212b" font-size="21" font-weight="600" text-anchor="start">来源日期的缺失</text><text x="28" y="64" fill="#526171" font-size="13" font-weight="400" text-anchor="start">文档与题目采用不同分母；题目分组互斥</text><text x="28" y="137" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">文档 n=4,052</text><rect x="190" y="112" width="314.25222112537017" height="42" fill="#087f75" /><rect x="504.25222112537017" y="112" width="335.74777887462983" height="42" fill="#9ba8b2" /><text x="347.1261105626851" y="138" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">有日期 48.3%</text><text x="672.1261105626851" y="138" fill="#17212b" font-size="14" font-weight="400" text-anchor="middle">无日期 51.7%</text><text x="28" y="224" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">题目 n=458</text><rect x="190" y="199" width="161.79039301310044" height="42" fill="#087f75" /><text x="270.89519650655023" y="225" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">全部有日期 24.9%</text><rect x="351.79039301310047" y="199" width="249.7816593886463" height="42" fill="#497db3" /><text x="476.6812227074236" y="225" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">部分有日期 38.4%</text><rect x="601.5720524017468" y="199" width="238.42794759825327" height="42" fill="#9ba8b2" /><text x="720.7860262008734" y="225" fill="#17212b" font-size="13" font-weight="600" text-anchor="middle">均无日期 36.7%</text><text x="28" y="292" fill="#526171" font-size="13" font-weight="400" text-anchor="start">只有 114 题的所有输入文档均带日期；正式实验需要按日期可见性分层。</text></g></svg>
