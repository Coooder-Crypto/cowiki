<svg xmlns="http://www.w3.org/2000/svg" width="960" height="394" viewBox="0 0 960 394" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">OKF 中期实验完成度与配对结果</title><desc id="figure-desc">实验完成 223/458 个配对。126 个双方正确，81 个双方错误，8 个仅结构化 S 正确，8 个仅 prose P 正确。</desc><rect x="0" y="0" width="960" height="394" fill="#ffffff" /><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" fill="#17212b" font-size="21" font-weight="600" text-anchor="start">中期样本：完成度与配对结果</text><text x="28" y="64" fill="#526171" font-size="13" font-weight="400" text-anchor="start">有效配对 223/458；446/916 次有效调用</text><text x="28" y="124" fill="#17212b" font-size="15" font-weight="600" text-anchor="start">实验完成度</text><rect x="170" y="100" width="650" height="34" fill="#f4f7f8" /><rect x="170" y="100" width="316.48471615720524" height="34" fill="#087f75" /><text x="478.48471615720524" y="123" fill="#ffffff" font-size="13" font-weight="600" text-anchor="end">223（48.7%）</text><text x="830" y="123" fill="#526171" font-size="13" font-weight="400" text-anchor="start">235 未运行</text><text x="28" y="211" fill="#17212b" font-size="15" font-weight="600" text-anchor="start">223 个配对</text><rect x="170" y="184" width="367.2645739910314" height="40" fill="#087f75" /><text x="353.6322869955157" y="210" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">126</text><rect x="537.2645739910314" y="184" width="236.09865470852017" height="40" fill="#9ba8b2" /><text x="655.3139013452915" y="210" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">81</text><rect x="773.3632286995515" y="184" width="23.318385650224215" height="40" fill="#497db3" /><rect x="796.6816143497757" y="184" width="23.318385650224215" height="40" fill="#c16b27" /><rect x="170" y="259" width="14" height="14" fill="#087f75" /><text x="192" y="273" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">双方正确：126（56.5%）</text><rect x="470" y="259" width="14" height="14" fill="#9ba8b2" /><text x="492" y="273" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">双方错误：81（36.3%）</text><rect x="170" y="301" width="14" height="14" fill="#497db3" /><text x="192" y="315" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">仅 S 正确：8（3.6%）</text><rect x="470" y="301" width="14" height="14" fill="#c16b27" /><text x="492" y="315" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">仅 P 正确：8（3.6%）</text><text x="28" y="370" fill="#526171" font-size="13" font-weight="400" text-anchor="start">S-only 与 P-only 均为 8；中期净差为 0，但预注册完成条件尚未满足。</text></g></svg>
