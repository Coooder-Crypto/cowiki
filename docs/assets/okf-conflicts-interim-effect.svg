<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">OKF 中期准确率与配对效应</title><desc id="figure-desc">P 与 S 的准确率均为 60.1%，Wilson 95% 区间均为 53.5% 到 66.3%。S 减 P 为 0.0 个百分点，配对 bootstrap 95% 区间为负 3.6 到正 3.6 个百分点。正式实验未完成。</desc><rect x="0" y="0" width="960" height="468" fill="#ffffff" /><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" fill="#17212b" font-size="21" font-weight="600" text-anchor="start">中期效应：点估计相同，正式判定仍未完成</text><text x="28" y="64" fill="#526171" font-size="13" font-weight="400" text-anchor="start">点为估计值，横线为 95% 区间；S − P 使用预注册配对 bootstrap</text><line x1="255" y1="104" x2="255" y2="225" stroke="#d9e0e6" stroke-width="1" /><text x="255" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">45%</text><line x1="348.3333333333333" y1="104" x2="348.3333333333333" y2="225" stroke="#d9e0e6" stroke-width="1" /><text x="348.3333333333333" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">50%</text><line x1="441.66666666666674" y1="104" x2="441.66666666666674" y2="225" stroke="#d9e0e6" stroke-width="1" /><text x="441.66666666666674" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">55%</text><line x1="535" y1="104" x2="535" y2="225" stroke="#d9e0e6" stroke-width="1" /><text x="535" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">60%</text><line x1="628.3333333333334" y1="104" x2="628.3333333333334" y2="225" stroke="#d9e0e6" stroke-width="1" /><text x="628.3333333333334" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">65%</text><line x1="721.6666666666665" y1="104" x2="721.6666666666665" y2="225" stroke="#d9e0e6" stroke-width="1" /><text x="721.6666666666665" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">70%</text><line x1="815" y1="104" x2="815" y2="225" stroke="#d9e0e6" stroke-width="1" /><text x="815" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">75%</text><text x="28" y="143" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">P：等价 prose</text><line x1="414.4832295935482" y1="138" x2="652.4861164717615" y2="138" stroke="#c16b27" stroke-width="3" /><line x1="414.4832295935482" y1="130" x2="414.4832295935482" y2="146" stroke="#c16b27" stroke-width="2" /><line x1="652.4861164717615" y1="130" x2="652.4861164717615" y2="146" stroke="#c16b27" stroke-width="2" /><circle cx="536.6741405082212" cy="138" r="6" fill="#c16b27"/><text x="936" y="143" fill="#17212b" font-size="12" font-weight="400" text-anchor="end">60.1% [53.5%, 66.3%]</text><text x="28" y="203" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">S：结构化 OKF</text><line x1="414.4832295935482" y1="198" x2="652.4861164717615" y2="198" stroke="#087f75" stroke-width="3" /><line x1="414.4832295935482" y1="190" x2="414.4832295935482" y2="206" stroke="#087f75" stroke-width="2" /><line x1="652.4861164717615" y1="190" x2="652.4861164717615" y2="206" stroke="#087f75" stroke-width="2" /><circle cx="536.6741405082212" cy="198" r="6" fill="#087f75"/><text x="936" y="203" fill="#17212b" font-size="12" font-weight="400" text-anchor="end">60.1% [53.5%, 66.3%]</text><text x="535" y="247" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">准确率（Wilson 95% 区间）</text><line x1="255" y1="292" x2="255" y2="382" stroke="#d9e0e6" stroke-width="1" /><text x="255" y="282" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">-8pp</text><line x1="360" y1="292" x2="360" y2="382" stroke="#a54848" stroke-width="1" stroke-dasharray="5 4"/><text x="360" y="282" fill="#a54848" font-size="12" font-weight="400" text-anchor="middle">-5pp</text><line x1="535" y1="292" x2="535" y2="382" stroke="#17212b" stroke-width="1.8" /><text x="535" y="282" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">0pp</text><line x1="710" y1="292" x2="710" y2="382" stroke="#d9e0e6" stroke-width="1" /><text x="710" y="282" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+5pp</text><line x1="815" y1="292" x2="815" y2="382" stroke="#d9e0e6" stroke-width="1" /><text x="815" y="282" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+8pp</text><text x="28" y="342" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">S − P 配对差值</text><line x1="409" y1="337" x2="661" y2="337" stroke="#087f75" stroke-width="3" /><line x1="409" y1="329" x2="409" y2="345" stroke="#087f75" stroke-width="2" /><line x1="661" y1="329" x2="661" y2="345" stroke="#087f75" stroke-width="2" /><circle cx="535" cy="337" r="6" fill="#087f75"/><text x="936" y="342" fill="#17212b" font-size="12" font-weight="400" text-anchor="end">0.0pp [-3.6pp, +3.6pp]</text><text x="535" y="404" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">准确率差值（右侧有利于 S；红线为 −5pp 非劣界值）</text><text x="28" y="444" fill="#a54848" font-size="13" font-weight="400" text-anchor="start">区间暂高于 −5pp，但只完成 48.7%，不能据此触发预注册 PASS。</text></g></svg>
