<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">CONFLICTS 四组 prompt 字符数</title><desc id="figure-desc">v0.1 原生平均 17.1k 字符，富 prose 17.5k，v0.2 结构化 18.9k，无 metadata 15.6k；圆点表示各组第 95 百分位。</desc><rect x="0" y="0" width="960" height="475" fill="#ffffff" /><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" fill="#17212b" font-size="21" font-weight="600" text-anchor="start">四组输入长度并不相等</text><text x="28" y="64" fill="#526171" font-size="13" font-weight="400" text-anchor="start">CONFLICTS 全量 458 题；字符数，不是 tokenizer token 数</text><line x1="224" y1="107" x2="224" y2="367" stroke="#d9e0e6" stroke-width="1" /><text x="224" y="97" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">0k</text><line x1="437.33333333333337" y1="107" x2="437.33333333333337" y2="367" stroke="#d9e0e6" stroke-width="1" /><text x="437.33333333333337" y="97" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">10k</text><line x1="650.6666666666667" y1="107" x2="650.6666666666667" y2="367" stroke="#d9e0e6" stroke-width="1" /><text x="650.6666666666667" y="97" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">20k</text><line x1="864" y1="107" x2="864" y2="367" stroke="#d9e0e6" stroke-width="1" /><text x="864" y="97" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">30k</text><text x="28" y="143" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">v0.1 原生</text><rect x="224" y="123" width="364.02622416302756" height="31" fill="#497db3" /><text x="595.0262241630276" y="145" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">17.1k</text><circle cx="736.5546666666667" cy="138.5" r="6" fill="#c16b27" /><text x="745.5546666666667" y="143" fill="#526171" font-size="12" font-weight="400" text-anchor="start">p95 24.0k</text><text x="28" y="205" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">v0.1 富 prose</text><rect x="224" y="185" width="373.51038136826776" height="31" fill="#497db3" /><text x="604.5103813682678" y="207" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">17.5k</text><circle cx="747.0506666666666" cy="200.5" r="6" fill="#c16b27" /><text x="756.0506666666666" y="205" fill="#526171" font-size="12" font-weight="400" text-anchor="start">p95 24.5k</text><text x="28" y="267" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">v0.2 结构化</text><rect x="224" y="247" width="403.5503697234353" height="31" fill="#087f75" /><text x="634.5503697234353" y="269" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">18.9k</text><circle cx="781.0986666666666" cy="262.5" r="6" fill="#c16b27" /><text x="790.0986666666666" y="267" fill="#526171" font-size="12" font-weight="400" text-anchor="start">p95 26.1k</text><text x="28" y="329" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">无 metadata</text><rect x="224" y="309" width="332.54372052401743" height="31" fill="#497db3" /><text x="563.5437205240174" y="331" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">15.6k</text><circle cx="704.8533333333334" cy="324.5" r="6" fill="#c16b27" /><text x="713.8533333333334" y="329" fill="#526171" font-size="12" font-weight="400" text-anchor="start">p95 22.5k</text><rect x="253" y="402" width="14" height="14" fill="#497db3" /><text x="274" y="414" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">平均值（横条）</text><circle cx="472" cy="409" r="6" fill="#c16b27" /><text x="488" y="414" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">第 95 百分位（点）</text><text x="28" y="458" fill="#526171" font-size="13" font-weight="400" text-anchor="start">v0.2 结构化组平均比富 prose 对照长约 8.0%；正式实验应记录实际 token 与截断。</text></g></svg>
