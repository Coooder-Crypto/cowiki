<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="443" viewBox="0 0 1060 443" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">CONFLICTS：配对正确率差值与 95% 区间</title><desc id="figure-desc">v0.2 结构化减富 prose：0pp，95% 区间负 15 到正 15pp。减无 metadata：正 15pp，区间 0 到正 40pp。减 v0.1 原生：正 10pp，区间 0 到正 25pp。</desc><rect x="0" y="0" width="1060" height="443" fill="#ffffff" /><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" fill="#17212b" font-size="21" font-weight="600" text-anchor="start">CONFLICTS：配对正确率差值与 95% 区间</text><text x="28" y="64" fill="#526171" font-size="13" font-weight="400" text-anchor="start">10 个独立 item，每 item 2 次生成；按 item 配对 bootstrap（描述性）</text><line x1="303" y1="118" x2="303" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="303" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">-20</text><line x1="379" y1="118" x2="379" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="379" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">-10</text><line x1="455" y1="118" x2="455" y2="348" stroke="#17212b" stroke-width="1.8" /><text x="455" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">0</text><line x1="531" y1="118" x2="531" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="531" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+10</text><line x1="607" y1="118" x2="607" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="607" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+20</text><line x1="683" y1="118" x2="683" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="683" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+30</text><line x1="759" y1="118" x2="759" y2="348" stroke="#d9e0e6" stroke-width="1" /><text x="759" y="103" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">+40</text><line x1="417" y1="118" x2="417" y2="348" stroke="#a54848" stroke-width="1.5" stroke-dasharray="5 4"/><text x="412" y="374" fill="#a54848" font-size="12" font-weight="400" text-anchor="end">非劣界值 -5pp</text><text x="28" y="159" fill="#17212b" font-size="14" font-weight="600" text-anchor="start">v0.2 结构化 − 富 prose</text><line x1="341" y1="154" x2="569" y2="154" stroke="#087f75" stroke-width="3" /><line x1="341" y1="145" x2="341" y2="163" stroke="#087f75" stroke-width="2" /><line x1="569" y1="145" x2="569" y2="163" stroke="#087f75" stroke-width="2" /><circle cx="455" cy="154" r="6" fill="#087f75" /><text x="815" y="159" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">0.0pp [-15.0, +15.0]</text><text x="28" y="233" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">v0.2 结构化 − 无 metadata</text><line x1="455" y1="228" x2="759" y2="228" stroke="#497db3" stroke-width="3" /><line x1="455" y1="219" x2="455" y2="237" stroke="#497db3" stroke-width="2" /><line x1="759" y1="219" x2="759" y2="237" stroke="#497db3" stroke-width="2" /><circle cx="569" cy="228" r="6" fill="#497db3" /><text x="815" y="233" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">+15.0pp [0.0, +40.0]</text><text x="28" y="307" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">v0.2 结构化 − v0.1 原生</text><line x1="455" y1="302" x2="645" y2="302" stroke="#497db3" stroke-width="3" /><line x1="455" y1="293" x2="455" y2="311" stroke="#497db3" stroke-width="2" /><line x1="645" y1="293" x2="645" y2="311" stroke="#497db3" stroke-width="2" /><circle cx="531" cy="302" r="6" fill="#497db3" /><text x="815" y="307" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">+10.0pp [0.0, +25.0]</text><text x="565" y="374" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">差值（百分点；右侧有利于 v0.2）</text><text x="28" y="426" fill="#526171" font-size="13" font-weight="400" text-anchor="start">主比较的区间跨越 0 与 −5p