<svg xmlns="http://www.w3.org/2000/svg" width="960" height="506" viewBox="0 0 960 506" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">OKF 中期分类别召回率</title><desc id="figure-desc">在 223 个中期配对中，互补信息召回率 P 为 65.2%、S 为 68.2%；观点研究冲突均为 82.1%；无冲突为 48.8% 和 47.7%；信息过时为 56.7% 和 53.3%；错误信息均为 0%，但仅有两题。</desc><rect x="0" y="0" width="960" height="506" fill="#ffffff" /><g font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="28" y="38" fill="#17212b" font-size="21" font-weight="600" text-anchor="start">中期分类别召回率</text><text x="28" y="64" fill="#526171" font-size="13" font-weight="400" text-anchor="start">圆点为 P，菱形为 S；n 是当前配对数，括号内为完整语料类别数</text><line x1="260" y1="105" x2="260" y2="397" stroke="#d9e0e6" stroke-width="1" /><text x="260" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">0%</text><line x1="392.5" y1="105" x2="392.5" y2="397" stroke="#d9e0e6" stroke-width="1" /><text x="392.5" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">25%</text><line x1="525" y1="105" x2="525" y2="397" stroke="#d9e0e6" stroke-width="1" /><text x="525" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">50%</text><line x1="657.5" y1="105" x2="657.5" y2="397" stroke="#d9e0e6" stroke-width="1" /><text x="657.5" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">75%</text><line x1="790" y1="105" x2="790" y2="397" stroke="#d9e0e6" stroke-width="1" /><text x="790" y="94" fill="#526171" font-size="12" font-weight="400" text-anchor="middle">100%</text><text x="28" y="136" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">无冲突</text><text x="200" y="136" fill="#526171" font-size="12" font-weight="400" text-anchor="end">n=86 (161)</text><line x1="518.8372093023256" y1="132" x2="512.6744186046512" y2="132" stroke="#d9e0e6" stroke-width="3" /><circle cx="518.8372093023256" cy="132" r="6" fill="#c16b27"/><polygon points="512.6744186046512,125 519.6744186046512,132 512.6744186046512,139 505.67441860465124,132" fill="#087f75"/><text x="936" y="136" fill="#17212b" font-size="12" font-weight="400" text-anchor="end">P 48.8% · S 47.7%</text><text x="28" y="192" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">互补信息</text><text x="200" y="192" fill="#526171" font-size="12" font-weight="400" text-anchor="end">n=66 (115)</text><line x1="605.3030303030303" y1="188" x2="621.3636363636363" y2="188" stroke="#d9e0e6" stroke-width="3" /><circle cx="605.3030303030303" cy="188" r="6" fill="#c16b27"/><polygon points="621.3636363636363,181 628.3636363636363,188 621.3636363636363,195 614.3636363636363,188" fill="#087f75"/><text x="936" y="192" fill="#17212b" font-size="12" font-weight="400" text-anchor="end">P 65.2% · S 68.2%</text><text x="28" y="248" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">观点/研究冲突</text><text x="200" y="248" fill="#526171" font-size="12" font-weight="400" text-anchor="end">n=39 (115)</text><line x1="694.8717948717949" y1="244" x2="694.8717948717949" y2="244" stroke="#d9e0e6" stroke-width="3" /><circle cx="694.8717948717949" cy="244" r="6" fill="#c16b27"/><polygon points="694.8717948717949,237 701.8717948717949,244 694.8717948717949,251 687.8717948717949,244" fill="#087f75"/><text x="936" y="248" fill="#17212b" font-size="12" font-weight="400" text-anchor="end">P 82.1% · S 82.1%</text><text x="28" y="304" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">信息过时</text><text x="200" y="304" fill="#526171" font-size="12" font-weight="400" text-anchor="end">n=30 (62)</text><line x1="560.3333333333333" y1="300" x2="542.6666666666667" y2="300" stroke="#d9e0e6" stroke-width="3" /><circle cx="560.3333333333333" cy="300" r="6" fill="#c16b27"/><polygon points="542.6666666666667,293 549.6666666666667,300 542.6666666666667,307 535.6666666666667,300" fill="#087f75"/><text x="936" y="304" fill="#17212b" font-size="12" font-weight="400" text-anchor="end">P 56.7% · S 53.3%</text><text x="28" y="360" fill="#17212b" font-size="14" font-weight="400" text-anchor="start">错误信息</text><text x="200" y="360" fill="#526171" font-size="12" font-weight="400" text-anchor="end">n=2 (5)</text><line x1="260" y1="356" x2="260" y2="356" stroke="#d9e0e6" stroke-width="3" /><circle cx="260" cy="356" r="6" fill="#c16b27"/><polygon points="260,349 267,356 260,363 253,356" fill="#087f75"/><text x="936" y="360" fill="#17212b" font-size="12" font-weight="400" text-anchor="end">P 0.0% · S 0.0%</text><circle cx="287" cy="436" r="6" fill="#c16b27"/><text x="301" y="441" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">P：等价 prose</text><polygon points="470,429 477,436 470,443 463,436" fill="#087f75"/><text x="485" y="441" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">S：结构化 OKF</text><text x="28" y="482" fill="#526171" font-size="13" font-weight="400" text-anchor="start">错误信息仅覆盖 2/5 题；观点/研究冲突仅覆盖 39/115 题，分类别结果不能外推。</text></g></svg>
